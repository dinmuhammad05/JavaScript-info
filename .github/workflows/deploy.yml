name: Deploy to GitHub Pages

# Har push'da saytni qayta yasab (node build.js), GitHub Pages'ga chiqaradi.
# Bir marta sozlash: Repo → Settings → Pages → Build and deployment →
#   Source: "GitHub Actions" ni tanlang.

on:
  push:
    branches:
      - main
      - claude/uzbek-site-variant-ys1f97
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (node build.js)
        run: node build.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
